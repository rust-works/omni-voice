name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: macos-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        features:
          - ""
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
    - name: Run tests
      # Run with --no-default-features so the `voxtral-mlx` default feature (and
      # its `mlx-sys`/MLX dependency) is excluded from these jobs. MLX drives the
      # Metal GPU, and GitHub's macos-latest runners (mid macOS-26 migration)
      # intermittently abort the whole test process (SIGABRT / "libc++abi:
      # terminating" or "language version 4.0 ... not supported") when Metal
      # kernels run on an incompatible runner — uncatchable, so it flakes
      # per-runner. Excluding the feature means no Metal code is linked or run
      # here. The default (voxtral-mlx) build is still compile-checked by Clippy
      # and exercised by the Coverage job (--all-features), where the model-free
      # MLX unit tests skip via `mlx_available()` (CI gate). The candle Metal
      # tests are model-gated (#[ignore]) and never run in CI either way. Full
      # MLX coverage runs locally on Apple Silicon via `scripts/build.sh`.
      run: |
        if [ -z "${{ matrix.features }}" ]; then
          cargo test --no-default-features --verbose
        else
          cargo test --no-default-features --features "${{ matrix.features }}" --verbose
        fi

  fmt:
    name: Rustfmt
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    strategy:
      matrix:
        features:
          - ""
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Run clippy
      run: |
        if [ -z "${{ matrix.features }}" ]; then
          cargo clippy --all-targets -- -D warnings
        else
          cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
        fi

  docs:
    name: Docs
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build docs
      run: cargo doc --no-deps --document-private-items

  coverage:
    name: Coverage
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write        # required to post the coverage comment
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0          # full history so `git merge-base` can resolve the PR's fork point
    - name: Cache Whisper tiny.en model
      # The model-gated voice tests (run below via the action's
      # extra-test-commands) need whisper-tiny.en on disk. The model is pinned
      # (HF Hub openai/whisper-tiny.en@refs/pr/15), so a constant cache key is
      # correct; bump the key if the pin ever changes. The action's setup
      # install-model is idempotent ("already installed") on a cache hit.
      uses: actions/cache@v6
      with:
        path: ~/.omni-voice/voice/models/whisper-tiny.en
        key: whisper-tiny-en-refs-pr-15
    - name: Cache wespeaker speaker-embedding model
      # The model-gated speaker test (voice_enroll_speaker_test, run below via
      # extra-test-commands) needs the wespeaker ResNet34 ONNX on disk. The asset
      # is a pinned public GitHub release (sha256 in src/voice/models.rs,
      # SPEAKER_WESPEAKER_EN), so a constant cache key is correct; bump the key if
      # the pin ever changes. The action's setup install-model is idempotent on a
      # cache hit.
      uses: actions/cache@v6
      with:
        path: ~/.omni-voice/voice/models/wespeaker-en-voxceleb-resnet34-LM
        key: wespeaker-en-voxceleb-resnet34-lm-e9848563
    # The coverage pipeline — toolchain + cargo-llvm-cov run, merge-base baseline
    # (download + git-worktree recompute fallback), the `omni-dev coverage diff`
    # sticky PR comment, summary + artifacts, baseline publish on main, and the
    # line gate — is packaged in action-works/omni-dev-coverage-check. The action
    # also installs the published `omni-dev` that renders the diff (replacing the
    # old `cargo install omni-dev`), and leaves codecov.io upload off by default
    # (it was already disabled here).
    #
    #   setup-commands installs the pinned Whisper model under the coverage
    #     instrumentation env with profiling disabled, so it reuses the
    #     instrumented build but contributes no coverage (the cache above feeds it).
    #   extra-test-commands run the fast model-gated `--ignored` suites that cover
    #     the candle Whisper inference path (WhisperEngine + the streaming
    #     backend's real-decode seam) and the wespeaker speaker-embedding path
    #     (WespeakerEmbedder in src/voice/speaker.rs, driving enroll,
    #     transcribe --speaker, and the live listen speaker gate/labeller), which
    #     the default workspace tests cannot reach without a model on disk; their
    #     coverage lands in the head report and the line gate. The 5-minute
    #     streaming envelope tests still run manually/locally (ADR-0041).
    - uses: action-works/omni-dev-coverage-check@v1
      with:
        # Pin the omni-dev version (the coverage-diff renderer) rather than
        # letting the action resolve "latest" via an unauthenticated GitHub API
        # call, which is rate-limited (60/hr per runner IP) and fails the run.
        version: 0.30.0
        fail-under-lines: 30
        # --accept-downloads bypasses the interactive consent prompt, which
        # otherwise aborts on the runner's non-interactive stdin whenever a
        # model cache misses and a real download is needed (idempotent no-op on
        # a cache hit).
        setup-commands: |
          cargo run --all-features --bin omni-voice -- install-model --accept-downloads
          cargo run --all-features --bin omni-voice -- install-model --variant speaker-wespeaker-en --accept-downloads
        extra-test-commands: |
          cargo test --all-features --test voice_transcribe_candle_test -- --ignored
          cargo test --all-features --test voice_streaming_candle_test streaming_smoke -- --ignored
          cargo test --all-features --lib voice::backends::candle:: -- --ignored
          cargo test --all-features --test voice_enroll_speaker_test -- --ignored
          cargo test --all-features --test voice_listen_speaker_gate_test -- --ignored

  audit:
    name: Security Audit
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - name: Run cargo-audit
      run: cargo audit

  deny:
    name: Dependency Policy
    # Stays on Linux: cargo-deny-action is a Docker container action (Docker is
    # unavailable on macOS runners), and dependency-policy checks read Cargo.lock
    # rather than compiling the crate, so the Apple-Silicon build guard is moot.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2.1.1
      with:
        command: check all

  secrets:
    name: Secret Scanning
    # Stays on Linux: the trufflehog action shells out to Docker, which is
    # unavailable on macOS runners. Secret scanning does not compile the crate.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: TruffleHog scan
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified
